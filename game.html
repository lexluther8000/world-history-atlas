<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atlas View</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>

    <iframe
        src="https://www.gameflare.com/embed/eaglercraft-minecraft-online/"
        title="Game"
        scrolling="no"
        allowfullscreen>
    </iframe>

    <!-- Boss Key -->
    <script>
        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                window.location.href = "https://classroom.google.com";
            }
        });
    </script>

</body>
</html>
