<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas View - Data Matrix</title>
</head>
<body style="margin: 0; padding: 0; background-color: #000000; display: flex; justify-content: center; align-items: center; height: 100vh;">

    <!-- Replace the src URL inside the quotes with your game's unblocked embed link later -->
    <iframe src="https://crazygames.com" 
            style="width: 100%; height: 100%; border: none;" 
            allowfullscreen>
    </iframe>

    <!-- Boss Key Script: Press Escape to instantly jump to Google Classroom -->
    <script>
      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
          window.location.href = 'https://google.com';
        }
      });
    </script>

</body>
</html>
