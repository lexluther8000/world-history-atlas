<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Atlas Browser</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        body {

            background: #ffffff;

            color: #222;
        }


        /* =================================
           TOOLBAR
           ================================= */

        .browser-ui {

            height: 122px;

            display: flex;

            flex-direction: column;

            background: #242424;

            color: white;
        }


        /* =================================
           TITLE BAR
           ================================= */

        .title-bar {

            height: 40px;

            display: flex;

            align-items: center;

            padding: 0 12px;

            background: #202020;
        }


        .title {

            font-size: 14px;

            font-weight: bold;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;
        }


        /* =================================
           TAB
           ================================= */

        .tabs {

            height: 38px;

            display: flex;

            align-items: flex-end;

            padding-left: 8px;

            background: #292929;
        }


        .tab {

            height: 34px;

            min-width: 180px;

            max-width: 300px;

            padding: 0 14px;

            display: flex;

            align-items: center;

            background: #ffffff;

            color: #222;

            border-radius:
                7px 7px 0 0;

            font-size: 13px;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;
        }


        /* =================================
           NAVIGATION BAR
           ================================= */

        .navigation {

            height: 44px;

            display: flex;

            align-items: center;

            gap: 6px;

            padding: 5px 8px;

            background: #eeeeee;
        }


        .nav-button {

            width: 34px;
            height: 32px;

            border: 1px solid #bbb;

            border-radius: 5px;

            background: white;

            color: #333;

            font-size: 17px;

            cursor: pointer;
        }


        .nav-button:hover:not(:disabled) {

            background: #ddd;
        }


        .nav-button:disabled {

            opacity: 0.4;

            cursor: default;
        }


        /* =================================
           ADDRESS BAR
           ================================= */

        .address-form {

            flex: 1;

            display: flex;

            min-width: 0;

            gap: 5px;
        }


        .address {

            flex: 1;

            min-width: 0;

            height: 32px;

            padding: 0 10px;

            border: 1px solid #aaa;

            border-radius: 5px;

            outline: none;

            font-size: 14px;
        }


        .address:focus {

            border-color: #4285f4;

            box-shadow:
                0 0 0 2px
                rgba(66, 133, 244, 0.2);
        }


        .go {

            height: 32px;

            padding: 0 14px;

            border: none;

            border-radius: 5px;

            background: #4285f4;

            color: white;

            cursor: pointer;
        }


        .go:hover {

            background: #3367d6;
        }


        /* =================================
           ERROR MESSAGE
           ================================= */

        .error {

            position: fixed;

            bottom: 20px;

            left: 50%;

            transform:
                translateX(-50%);

            padding: 10px 18px;

            border-radius: 6px;

            background: #222;

            color: white;

            font-size: 13px;

            display: none;

            z-index: 100;
        }


        .error.show {

            display: block;
        }


        /* =================================
           MOBILE
           ================================= */

        @media (max-width: 600px) {

            .browser-ui {

                height: 122px;
            }


            .tab {

                min-width: 130px;
            }


            .navigation {

                gap: 4px;
            }


            .nav-button {

                width: 32px;
            }


            .go {

                padding: 0 10px;
            }
        }

    </style>

</head>


<body>


    <!-- =================================
         BROWSER INTERFACE
         ================================= -->

    <div class="browser-ui">


        <!-- TITLE -->

        <div class="title-bar">

            <div
                class="title"
                id="title">

                Atlas Browser

            </div>

        </div>


        <!-- ONE TAB -->

        <div class="tabs">

            <div
                class="tab"
                id="tab">

                New Tab

            </div>

        </div>


        <!-- NAVIGATION -->

        <div class="navigation">


            <button
                class="nav-button"
                id="back"
                title="Back"
                disabled>

                ←

            </button>


            <button
                class="nav-button"
                id="forward"
                title="Forward"
                disabled>

                →

            </button>


            <button
                class="nav-button"
                id="refresh"
                title="Refresh">

                ↻

            </button>


            <button
                class="nav-button"
                id="home"
                title="Home">

                ⌂

            </button>


            <form
                class="address-form"
                id="addressForm">


                <input
                    class="address"
                    id="address"
                    type="text"
                    placeholder="Search or enter a website..."
                    autocomplete="off"
                    spellcheck="false">


                <button
                    class="go"
                    type="submit">

                    Go

                </button>


            </form>

        </div>

    </div>


    <!-- ERROR -->

    <div
        class="error"
        id="error">

        The website could not be loaded.

    </div>


    <script>

        const address =
            document.getElementById(
                "address"
            );


        const addressForm =
            document.getElementById(
                "addressForm"
            );


        const back =
            document.getElementById(
                "back"
            );


        const forward =
            document.getElementById(
                "forward"
            );


        const refresh =
            document.getElementById(
                "refresh"
            );


        const home =
            document.getElementById(
                "home"
            );


        const tab =
            document.getElementById(
                "tab"
            );


        const title =
            document.getElementById(
                "title"
            );


        const error =
            document.getElementById(
                "error"
            );


        /* =================================
           NAVIGATE
           ================================= */

        addressForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const value =
                    address.value.trim();


                if (!value) {
                    return;
                }


                /*
                 * If it looks like a URL,
                 * navigate directly.
                 */

                const looksLikeURL =
                    /^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+/
                        .test(value) ||
                    value.startsWith(
                        "http://"
                    ) ||
                    value.startsWith(
                        "https://"
                    );


                if (looksLikeURL) {

                    await window.atlasBrowser
                        .navigate(
                            value
                        );

                }
                else {

                    await window.atlasBrowser
                        .search(
                            value
                        );
                }
            }
        );


        /* =================================
           BACK
           ================================= */

        back.addEventListener(
            "click",
            () => {

                window.atlasBrowser.back();
            }
        );


        /* =================================
           FORWARD
           ================================= */

        forward.addEventListener(
            "click",
            () => {

                window.atlasBrowser.forward();
            }
        );


        /* =================================
           REFRESH
           ================================= */

        refresh.addEventListener(
            "click",
            () => {

                window.atlasBrowser.refresh();
            }
        );


        /* =================================
           HOME
           ================================= */

        home.addEventListener(
            "click",
            () => {

                window.atlasBrowser.home();
            }
        );


        /* =================================
           URL CHANGED
           ================================= */

        window.atlasBrowser.onURLChange(
            (url) => {

                address.value =
                    url;
            }
        );


        /* =================================
           TITLE CHANGED
           ================================= */

        window.atlasBrowser.onTitleChange(
            (pageTitle) => {

                if (!pageTitle) {
                    return;
                }


                tab.textContent =
                    pageTitle;


                title.textContent =
                    pageTitle;
            }
        );


        /* =================================
           NAVIGATION STATE
           ================================= */

        window.atlasBrowser.onNavigationState(
            (state) => {

                back.disabled =
                    !state.canGoBack;


                forward.disabled =
                    !state.canGoForward;
            }
        );


        /* =================================
           ERROR
           ================================= */

        window.atlasBrowser.onError(
            (info) => {

                console.error(
                    info
                );


                error.textContent =
                    "Could not load: " +
                    info.errorDescription;


                error.classList.add(
                    "show"
                );


                setTimeout(
                    () => {

                        error.classList.remove(
                            "show"
                        );

                    },
                    5000
                );
            }
        );

    </script>

</body>

</html>
